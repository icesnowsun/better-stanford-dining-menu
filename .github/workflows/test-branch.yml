name: Test a branch

# The suite on every push to a branch other than main, so a change can be
# checked before it is merged. main itself is tested by pages.yml before
# every deploy.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the tests
        run: uv run pytest
